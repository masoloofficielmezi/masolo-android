# Compile l'APK de Masolo dans le cloud (aucune installation d'Android Studio nécessaire).
# Lancement : onglet « Actions » > « Build APK » > « Run workflow ». Résultat : artefact « Masolo-APK » (fichier Masolo.apk).
name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon
      - name: Préparer le fichier
        run: cp app/build/outputs/apk/release/app-release.apk Masolo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Masolo-APK
          path: Masolo.apk
