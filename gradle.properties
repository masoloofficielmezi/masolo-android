org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ============ ADRESSE DU SITE ============
# Adresse de votre serveur Masolo (doit se terminer par « / »).
MASOLO_PROD_URL=https://masolo.site.je/
# Version de débogage (Android Studio) : même site par défaut.
# Pour tester en local : émulateur -> http://10.0.2.2/masolo/  |  téléphone sur le Wi-Fi -> http://192.168.X.X/masolo/
MASOLO_DEBUG_URL=https://masolo.site.je/
# Mettre "true" UNIQUEMENT si le HTTPS n'est pas encore actif sur votre site (adresse en http://). À repasser à false ensuite.
MASOLO_ALLOW_HTTP=false

# Signature de la version « release » (facultatif : sans cela, l'APK release est signé avec la clé de débogage, installable pour tester)
# MASOLO_KEYSTORE=C:/chemin/masolo.jks
# MASOLO_KEYSTORE_PASSWORD=...
# MASOLO_KEY_ALIAS=masolo
# MASOLO_KEY_PASSWORD=...
